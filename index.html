.4 12h5.4"/><circle cx="12" cy="12" r="2.9"/></svg><h1>pokeroute</h1></div><p class="lede">A run planner for Pokémon games — what to catch, what to skip, and what beats the next fight.</p><h2>Open a game</h2><a class="game" href="dist/frlg.html"><span class="nm">FireRed / LeafGreen</span><span class="sub">Kanto · 23 stops</span><svg class="i" viewBox="0 0 24 24"><path d="m9.6 5.4 6.6 6.6-6.6 6.6"/></svg></a><footer><a href="https://github.com/bjdealey/pokeroute">Source on GitHub</a></footer></main>
