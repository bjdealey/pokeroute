<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Route Planner</title>
<style>
:root{
  --bg:#0d1017;--bg2:#111520;--card:#161b26;--card2:#1c2230;--line:#252b3a;--line2:#333c50;
  --fg:#e7eaf2;--dim:#8b93a7;--dim2:#69718a;--acc:#6ea8fe;--acc2:#a8ccff;--accbg:#16203a;
  --good:#4ade80;--goodbg:#122a1e;--warn:#fbbf24;--warnbg:#2a2213;--bad:#f87171;--sea:#2f6ba8;
  --r:10px;--r2:14px;--hdr:56px;
  --sh:0 1px 2px rgba(0,0,0,.32),0 8px 24px -14px rgba(0,0,0,.7);
  --ring:0 0 0 2px var(--bg),0 0 0 4px var(--acc)}
*{box-sizing:border-box}
body{margin:0;font:15px/1.55 system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--fg);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
:focus-visible{outline:none;box-shadow:var(--ring);border-radius:8px}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:#2b3244;border-radius:8px;border:2px solid var(--bg)}
*::-webkit-scrollbar-thumb:hover{background:#3a445c}
kbd{font:600 10px/1.6 ui-monospace,Menlo,monospace;background:var(--card2);border:1px solid var(--line2);
  border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--dim);vertical-align:1px}
/* the icon set: one inline SVG sprite, sized in em so it tracks its text */
svg.i{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;vertical-align:-.14em}
svg.isprite{position:absolute;width:0;height:0;overflow:hidden}
img{image-rendering:pixelated}
header{min-height:var(--hdr);padding:8px 18px;border-bottom:1px solid var(--line);display:flex;gap:16px;
  align-items:center;position:sticky;top:0;background:#0d1017f2;backdrop-filter:blur(10px);z-index:9}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mark{width:26px;height:26px;color:var(--acc);stroke-width:1.6;flex:none}
.ttl{min-width:0;line-height:1.15}
h1{font-size:15.5px;margin:0;font-weight:650;letter-spacing:-.01em;white-space:nowrap}
.ttl small{display:block;color:var(--dim);font-size:11.5px;letter-spacing:.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hprog{display:flex;align-items:center;gap:10px;margin-left:auto;width:230px;flex:none}
.hprog .bar{height:6px;background:var(--card2);border:1px solid var(--line);border-radius:99px}
.hprog .bar i{background:linear-gradient(90deg,var(--acc),#8be9a4);transition:width .35s ease}
.hprog .meta{white-space:nowrap;font-variant-numeric:tabular-nums;font-size:12px}
.wrap{display:grid;grid-template-columns:474px 1fr}
aside{border-right:1px solid var(--line);background:var(--bg2);padding:14px 14px 20px;position:sticky;
  top:var(--hdr);max-height:calc(100vh - var(--hdr));overflow:auto;scrollbar-gutter:stable}
main{padding:20px 24px 40px;max-width:900px;min-width:0}
body.wide main{max-width:none}   /* the dexes are tables, not prose */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:15px 17px;
  margin:0 0 14px;box-shadow:var(--sh)}
h2{font-size:21px;margin:0 0 6px;letter-spacing:-.015em}
h3{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:26px 0 10px;
  display:flex;align-items:center;gap:8px;font-weight:650}
h3 svg.i{width:14px;height:14px;color:var(--acc);opacity:.85}
h3::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.meta{color:var(--dim);font-size:13px}
.notes{display:flex;gap:10px;align-items:flex-start;border-left:3px solid var(--acc);background:#141b2b;
  border-radius:0 9px 9px 0;padding:10px 13px;margin:12px 0;color:#c3c8d6;font-size:14px;line-height:1.55}
.notes svg.i{width:16px;height:16px;margin-top:2px;flex:none;color:var(--acc);opacity:.9}
ol,ul{margin:0;padding-left:20px}li{margin:7px 0}
.why{color:var(--dim);font-size:13px}
/* map */
.mapwrap{position:relative;margin-bottom:6px}
.maphead{position:absolute;top:7px;left:8px;z-index:2;color:#fff;font:700 13px/1 ui-monospace,Menlo,monospace;
  letter-spacing:.14em;text-transform:uppercase;text-shadow:2px 2px 0 #17324f,-1px -1px 0 #17324f,1px -1px 0 #17324f,-1px 1px 0 #17324f;
  pointer-events:none}
svg.map{width:100%;display:block;background:#a5d8f2;border:3px solid #17324f;border-radius:3px}
svg.map .stripe{stroke:#8ac6e8;stroke-width:1}
svg.map .coast{fill:none;stroke:#256b2c;stroke-linecap:square;stroke-linejoin:miter}
svg.map .land{fill:none;stroke:#46b04a;stroke-linecap:square;stroke-linejoin:miter}
svg.map .inland polygon{fill:#256b2c;stroke:#256b2c;stroke-width:15;stroke-linejoin:miter}
svg.map .inland2 polygon{fill:#46b04a;stroke:#46b04a;stroke-width:12.6;stroke-linejoin:miter}
/* roads carry the progress: walked ones are warm, the rest are washed out */
svg.map .roadbase{fill:none;stroke:#2f7a38;stroke-width:3.4;stroke-linecap:square}
svg.map .road{fill:none;stroke-width:2.2;stroke-linecap:square}
svg.map .road.future{stroke:#9fbe93}
svg.map .road.done{stroke:#e8b24a}
svg.map .road.here{stroke:#fff36b;stroke-width:2.8}
svg.map .ferry{fill:none;stroke:#fff;stroke-width:.6;stroke-dasharray:1.4 1.8;opacity:.8}
svg.map .tunnel{fill:none;stroke:#7a5c30;stroke-width:.7;stroke-dasharray:1 1.4;opacity:.8}
svg.map g.n{cursor:pointer}
svg.map g.n .hitbox{fill:transparent}
svg.map .mk{stroke:#17324f;stroke-width:.5}
/* not been there yet: washed out. been there: full colour. */
svg.map g.n.future .mk{fill:#b9c9b2;stroke:#6f8a74}
svg.map g.n.future .pip{fill:#eaf1e6}
svg.map g.n.city.done .mk,svg.map g.n.city.here .mk{fill:#e8443c}
svg.map g.n.cave.done .mk,svg.map g.n.cave.here .mk{fill:#5b4a33}
svg.map g.n.done .pip,svg.map g.n.here .pip{fill:#fff}
svg.map g.n.here .mk{fill:#fff36b;stroke:#7a5a00}    /* routes have no marker of their own */
svg.map .gymring{fill:none;stroke:#c9962f;stroke-width:.7;opacity:.75}
svg.map g.n.done .gymring{stroke:#ffd34d;opacity:1}
/* you are here: the only thing on the map that moves */
svg.map .halo{fill:none;stroke:#fff36b;stroke-width:1.1;opacity:.9;
  transform-box:fill-box;transform-origin:center;animation:ping 1.8s ease-out infinite}
svg.map .here-dot{fill:none;stroke:#fff;stroke-width:1.3}
@keyframes ping{0%{r:3.2;opacity:1}70%{r:6.4;opacity:0}100%{r:6.4;opacity:0}}
@media(prefers-reduced-motion:reduce){svg.map .halo{animation:none;opacity:.85}}
svg.map g.n:hover .mk{stroke:#fff;stroke-width:1}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--dim);padding:6px 2px 4px}
.legend i{display:inline-block;width:9px;height:9px;margin-right:5px;vertical-align:middle;
  border:1px solid #17324f;border-radius:2px}
/* walking the route: the same move as [ and ], where your eye already is */
.stepnav{display:flex;gap:10px;margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}
.stepnav .stepbtn{flex:1;justify-content:space-between;text-align:left;padding:11px 14px;
  border-radius:12px;gap:12px;min-height:52px}
.stepnav .stepbtn span{display:flex;flex:1;flex-direction:column;gap:2px;color:var(--fg);
  font-size:13.5px;font-weight:600;min-width:0;align-items:flex-start;text-align:left}
.stepnav .stepbtn small{color:var(--dim2);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  font-weight:650}
.stepnav .stepbtn svg.i{width:17px;height:17px;color:var(--dim)}
.stepnav .stepbtn svg.flip{transform:rotate(180deg)}
.stepnav .stepbtn:last-child:not(:only-child) span{align-items:flex-end;text-align:right}
.stepnav .stepbtn:hover svg.i{color:var(--acc)}
/* stop list */
.stops{display:flex;flex-direction:column;gap:1px}
.stops button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;
  border:0;border-left:2px solid transparent;color:var(--dim);padding:7px 9px;border-radius:8px;
  cursor:pointer;font:inherit;font-size:13px;transition:background .12s,color .12s}
.stops button:hover{background:var(--card2);color:var(--fg)}
.stops .ix{flex:none;width:20px;height:20px;display:grid;place-items:center;border-radius:6px;
  background:var(--card2);color:var(--dim2);font:600 10.5px/1 ui-monospace,Menlo,monospace;
  font-variant-numeric:tabular-nums}
.stops .snm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stops .sicon{flex:none;width:14px;height:14px;color:var(--good)}
.stops button.done{color:var(--dim2)}
.stops button.done .snm{text-decoration:line-through;text-decoration-color:#3d4457}
.stops button.done .ix{background:var(--goodbg);color:var(--good)}
.stops button.on{background:var(--accbg);color:var(--acc2);font-weight:600;border-left-color:var(--acc)}
.stops button.on .ix{background:var(--acc);color:#0b0d12}
.stops button.on .snm{text-decoration:none}
/* mons */
.mon{display:grid;grid-template-columns:62px 56px 1fr;gap:12px;align-items:start;padding:12px 0;
  border-bottom:1px solid var(--line)}
.mon:last-child{border:0}
.rank{display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--dim);
  font-variant-numeric:tabular-nums;padding-top:6px}
.rank .no{width:22px;height:22px;display:grid;place-items:center;border-radius:7px;background:var(--card2);
  border:1px solid var(--line);font-size:11px;font-weight:650;color:var(--dim)}
.rank button.g{padding:3px 7px;font-size:11px;width:100%;justify-content:center;gap:4px}
.rank button.g svg.i{width:12px;height:12px}
.spr{width:56px;height:56px;object-fit:contain}
.nm{font-weight:600;text-transform:capitalize}
.t{font-size:11px;padding:1px 7px;border-radius:20px;background:#2a3040;color:#c9d1e4;text-transform:capitalize;margin-left:5px}
.chain{display:flex;align-items:center;gap:3px;flex-wrap:wrap;margin:4px 0}
.chain img{width:32px;height:32px}
.chain span{color:var(--dim);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 10px;border-radius:20px;
  border:1px solid var(--line);background:var(--card2);color:var(--dim)}
.pill.b{border-color:#6b5320;background:var(--warnbg);color:var(--warn)}
.pill svg.i{width:13px;height:13px}
button.g{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line2);
  color:var(--dim);border-radius:8px;padding:5px 11px;cursor:pointer;font:inherit;font-size:12.5px;
  line-height:1.4;transition:background .13s,color .13s,border-color .13s}
button.g:hover{background:#232a3b;color:var(--fg);border-color:#3d465c}
button.g:active{transform:translateY(1px)}
button.g.on{border-color:var(--good);color:var(--good);background:var(--goodbg)}
button.g.danger:hover{border-color:#7a3b3b;color:#ffb4b4;background:#2a1618}
button.g svg.i{width:14px;height:14px}
button.g[disabled]{opacity:.45;cursor:not-allowed}
.prog{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:13px}
.prog .ok{color:var(--good);margin-top:0}
.prog .ev{color:#6f7890;font-size:12px}
.nudge{margin-left:auto}
.bar{height:4px;background:var(--line);border-radius:3px;overflow:hidden;flex:1;min-width:110px}
.bar i{display:block;height:100%;background:var(--good)}
/* party / PC, in the shape of the in-game screens */
.pkui{background:linear-gradient(#33578c,#1d3557);border:3px solid #0b1626;border-radius:14px;padding:13px;
  margin-bottom:14px;box-shadow:var(--sh)}
.pkui h4{margin:0 0 10px;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:#bcd6f5;
  font-weight:700;display:flex;align-items:center;gap:7px}
.pkui h4 svg.i{width:14px;height:14px;opacity:.9}
.pkui h4 .ct{margin-left:auto;letter-spacing:.02em;text-transform:none;font-weight:600;color:#8fb4e2;
  background:#12294a;border-radius:20px;padding:2px 9px;font-size:11px}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slot{display:flex;gap:9px;align-items:center;background:#eef3fa;color:#152238;border:2px solid #0b1626;
  border-radius:14px;padding:6px 10px;min-height:56px;cursor:pointer;user-select:none;
  transition:background .12s,transform .12s}
.slot:hover{background:#fff;transform:translateY(-1px)}
.slot img{width:44px;height:44px;flex:none}
.slot b{display:block;font-size:13px;text-transform:capitalize;line-height:1.2}
.slot .who{min-width:0}
.slot .lv{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:#4a5a73;margin:2px 0}
.slot .lv input{width:44px;padding:1px 4px;font:inherit;font-size:11px;border:1px solid #8fa6c4;
  border-radius:4px;background:#fff;color:#152238}
.slot .xp{color:#a8511c}.slot .ok2{color:#1d7a3c}
.evos{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.evo{display:flex;align-items:center;gap:4px;background:#d8ead8;border:2px solid #2f6b3f;color:#14401f;
  border-radius:9px;padding:2px 7px 2px 3px;font:inherit;font-size:11px;font-weight:700;cursor:pointer;
  text-transform:capitalize}
.evo:hover{background:#b9dfba}
.evo img{width:22px;height:22px}
.evo small{font-weight:400;color:#3f6b4d;text-transform:none}
.evo.off{background:#e3e8ef;border-color:#9aa6b6;color:#7d879a;cursor:not-allowed}
.evo.off small{color:#8d97a8}
.livewarn{color:#a8511c;display:block;margin-top:3px}
.cell .rdy{position:absolute;top:2px;right:2px;color:#8fe27a;line-height:0}
.cell .rdy svg.i{width:12px;height:12px;stroke-width:2.1;filter:drop-shadow(0 0 2px #0b1626)}
.mslots{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.mslot{display:flex;flex-direction:column;gap:4px}
.mslot span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim2);font-weight:650}
.mslots select{width:100%;padding:7px 8px;font:inherit;font-size:12.5px;border:1px solid var(--line);
  border-radius:8px;background:#11151d;color:var(--fg);cursor:pointer}
.mslots select:hover{border-color:var(--line2)}
.advice{margin-top:9px;font-size:13px;color:#c3c8d6;border-left:3px solid var(--good);padding-left:10px}
.advice b{color:var(--good)}
.note{display:flex;align-items:flex-start;gap:8px;margin-top:9px;font-size:12px;color:#c9a86a;
  background:#211d14;border:1px solid #3d3320;border-radius:8px;padding:7px 10px;line-height:1.5}
.note svg.i{width:14px;height:14px;margin-top:2px;flex:none}
.spots tr.later td{opacity:.55}
img.mini{width:26px;height:26px;vertical-align:middle}
.spots tr:hover td{background:#1b2130}
.spots td:first-child{border-radius:7px 0 0 7px}
.spots td:last-child{border-radius:0 7px 7px 0}
.give{margin-left:8px;border-color:var(--good);color:var(--good)}
.carrying{display:inline-flex;align-items:center;gap:4px;color:var(--good);font-size:12px;margin-left:8px}
.carrying svg.i{width:13px;height:13px;stroke-width:2.1}
.slot small{color:#4a5a73;font-size:11px;line-height:1.3;display:block}
.slot .hm{color:#1c5fa8;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.slot.empty{background:#2b4a79;border-style:dashed;border-color:#5d84bb;color:#8cb2e0;gap:6px;
  justify-content:center;align-items:center;font-size:11.5px;cursor:default}
.slot.empty:hover{background:#2b4a79;transform:none}
.slot.empty svg.i{width:14px;height:14px;opacity:.8}
.pcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px}
.cell{aspect-ratio:1;background:#2a4a7d;border:2px solid #0b1626;border-radius:9px;
  display:grid;place-items:center;cursor:grab;position:relative;transition:background .12s,transform .12s}
.cell:hover{background:#35598f;transform:translateY(-1px)}
.cell.empty{background:#223d68;border-color:#33547f;cursor:default}
.cell.empty:hover{background:#223d68;transform:none}
.cell img{width:82%;height:82%;object-fit:contain}
.cell span{position:absolute;bottom:1px;left:0;right:0;font-size:8.5px;text-align:center;color:#bcd6f5;
  text-transform:capitalize;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pkui.drop{outline:3px dashed #ffd34d;outline-offset:2px}
.notice{display:flex;align-items:flex-start;gap:8px;color:#ffd77a;background:var(--warnbg);
  border:1px solid #493a1c;border-radius:10px;padding:9px 12px;font-size:12.5px;margin:0 0 14px}
.notice svg.i{width:15px;height:15px;margin-top:2px;flex:none;color:var(--warn)}
.drophint{display:flex;align-items:center;gap:7px;color:var(--dim2);font-size:11.5px;margin:-6px 0 14px}
.drophint svg.i{width:14px;height:14px}
/* one-line slots; the detail lives in the sheet */
.slot .who{flex:1;min-width:0}
.slot .lvtag{font-size:11px;color:#4a5a73;margin-left:6px;font-weight:600}
.slot .rdytag{display:inline-flex;align-items:center;gap:3px;font-size:10px;color:#12602f;
  background:#cbeed6;border-radius:20px;padding:1px 7px 1px 5px;margin-left:6px;font-weight:700;
  vertical-align:1px}
.slot .rdytag svg.i{width:11px;height:11px;stroke-width:2.2}
.slot .chev{color:#8fa6c4;flex:none;line-height:0}
.slot .chev svg.i{width:17px;height:17px}
.slot .lvtag{background:#dde6f2;border-radius:20px;padding:1px 7px}
.slot small{display:block;color:#4a5a73;font-size:11px;line-height:1.35}
/* the sheet */
.modal{position:fixed;inset:0;z-index:40;background:#070a12cc;backdrop-filter:blur(4px);display:flex;
  align-items:center;justify-content:center;padding:16px;overflow:auto;animation:fade .16s ease}
.modal[hidden]{display:none}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(10px) scale(.985)}}
.sheet{background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:0 18px 18px;
  width:min(540px,100%);max-height:90vh;overflow:auto;box-shadow:0 24px 60px -20px #000c;
  animation:rise .18s cubic-bezier(.2,.8,.3,1)}
@media(prefers-reduced-motion:reduce){.modal,.sheet{animation:none}}
.shead{display:flex;align-items:center;gap:13px;padding:14px 0 12px;position:sticky;top:0;z-index:3;
  background:var(--card);border-bottom:1px solid var(--line)}
.shead img{width:64px;height:64px}
.shead b{font-size:20px;text-transform:capitalize;letter-spacing:-.01em}
.shead .x{margin-left:auto;align-self:flex-start;background:var(--card2);border:1px solid var(--line);
  color:var(--dim);cursor:pointer;padding:7px;border-radius:9px;display:flex;line-height:0}
.shead .x svg.i{width:16px;height:16px}
.shead .x:hover{color:var(--fg);border-color:var(--line2);background:#232a3b}
.srow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line)}
.srow .lv{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--dim)}
.srow .lv input{width:62px;padding:6px 8px;font:inherit;font-size:14px;border:1px solid var(--line);
  border-radius:6px;background:#11151d;color:var(--fg)}
.srow .xp{color:var(--warn);font-size:13px}
.srow .ok2{color:var(--good);font-size:13px}
.ssec{padding:12px 0;border-top:1px solid var(--line)}
.ssec h5{margin:0 0 9px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);
  display:flex;align-items:center;gap:7px;font-weight:650}
.ssec h5 svg.i{width:13px;height:13px;color:var(--acc);opacity:.85}
.ssec .auto{margin-top:8px}
.sfoot{display:flex;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.sfoot button{flex:1;min-height:38px}
.sheet .evo{background:#16301f;border-color:#2f6b3f;color:#9ce8b4}
.sheet .evo:hover{background:#1d4029}
.sheet .evo small{color:#6fae87}
.sheet .evo.off{background:#1a1e27;border-color:#333b4a;color:#6a7387}
.sheet .evo.off small{color:#5b6376}
.drag{opacity:.35}
.roster{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 2px}
.roster div{text-align:center;font-size:11px;color:var(--dim);width:60px;text-transform:capitalize}
.roster img{width:48px;height:48px;display:block;margin:0 auto}
.roster b{color:var(--fg);font-weight:600}
.ctr{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.ctr div{width:74px;text-align:center;font-size:11px;color:var(--dim);text-transform:capitalize;
  border:1px solid var(--line);border-radius:8px;padding:5px 2px}
.ctr div.have{border-color:var(--good);background:#132a1f}
.ctr div.trade{opacity:.55}
.ctr img{width:44px;height:44px;display:block;margin:0 auto}
.ctr .src{font-size:10px;color:#666e85;display:block;text-transform:none;line-height:1.25}
.gap{color:var(--warn);font-size:13px;margin-top:8px}
.swapline{display:flex;gap:7px;align-items:flex-start;padding:3px 0}
.swapline svg.i{width:14px;height:14px;margin-top:3px;flex:none;opacity:.7}
.warn{color:#e8b45f;font-size:13px;margin-top:8px}
.ctr div.stored{border-color:#4a5a7a;background:#151d2b}
.dex .covered{color:#78849b}.dex .have{color:var(--good)}.dex .need{color:#c9d1e4}
.mon.dim{opacity:.45}
.ok{display:inline-flex;align-items:center;gap:6px;color:var(--good);font-size:13px;margin-top:8px}
.prog .meta{display:inline-flex;align-items:center;gap:6px}
.prog svg.i{width:14px;height:14px}
/* the three verdict lines under a fight card, told apart at a glance */
.verdict{display:flex;align-items:flex-start;gap:8px;margin-top:10px;font-size:13px;
  border-radius:9px;padding:8px 11px;line-height:1.5}
.verdict svg.i{width:15px;height:15px;margin-top:2px;flex:none}
.verdict.good{color:#9df0bb;background:var(--goodbg);border:1px solid #1f4a31}
.verdict.hold{color:#cfe0ff;background:#16203a;border:1px solid #2c3f63}
.verdict.bad{color:#ffcf87;background:var(--warnbg);border:1px solid #4a3a1c}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:3px 0}
.chip{font-size:11px;padding:1px 7px;border-radius:5px;background:#232838;color:var(--dim)}
.chip.v{color:#9fd0ff}.chip.e{color:#ffcf87}
.cost{color:#7d859c;font-size:12px;margin-top:2px}
.cost b{color:var(--warn);font-weight:500}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.tools .lbl{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim2);font-weight:650}
.tools .seg{margin:0}
.qbox{position:relative;display:flex;align-items:center;margin-bottom:14px}
.qbox .qico{position:absolute;left:11px;width:15px;height:15px;color:var(--dim2);pointer-events:none}
#q{width:100%;padding:9px 62px 9px 34px;border-radius:10px;border:1px solid var(--line);
   background:var(--card);color:var(--fg);font:inherit;font-size:13px;transition:border-color .13s}
#q:hover{border-color:var(--line2)}
#q::placeholder{color:#5d6478}
.qbox .qx{position:absolute;right:32px;background:none;border:0;color:var(--dim2);cursor:pointer;
  padding:4px;display:flex;border-radius:6px}
.qbox .qx:hover{color:var(--fg)}
.qbox .qx[hidden]{display:none}
.qbox .qkbd{position:absolute;right:9px;pointer-events:none}
.secttl{display:flex;align-items:center;gap:7px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim2);font-weight:650;margin:0 0 7px}
.secttl svg.i{width:13px;height:13px;color:var(--acc);opacity:.8}
.secttl .ct{margin-left:auto;letter-spacing:0;text-transform:none;font-weight:500;color:var(--dim2)}
.kbdhint{display:flex;gap:8px;align-items:flex-start;margin-top:14px;padding-top:12px;
  border-top:1px solid var(--line);color:var(--dim2);font-size:11px;line-height:1.7}
.kbdhint svg.i{width:14px;height:14px;margin-top:3px;flex:none}
.qmbox{position:relative;display:flex;align-items:center;margin-bottom:14px}
.qmbox svg.i{position:absolute;left:14px;width:17px;height:17px;color:var(--dim2);pointer-events:none}
.qm{width:100%;padding:11px 14px 11px 41px;border-radius:11px;border:1px solid var(--line);
  background:var(--card);color:var(--fg);font:inherit;font-size:14.5px;transition:border-color .13s}
.qm:hover{border-color:var(--line2)}
.qm::placeholder{color:#5d6478}
.dex{font-size:12px;margin-top:5px;line-height:1.6}
.dex span{display:inline-flex;align-items:flex-start;gap:5px}
.dex svg.i{width:13px;height:13px;margin-top:2px;flex:none}
.dex .later{color:#7fb3e8}.dex .only{color:var(--warn)}.dex .skip{color:var(--good)}
.ver{font-size:10px;padding:1px 5px;border-radius:4px;border:1px solid var(--line);color:var(--dim);margin-left:5px}
.ver.x{border-color:#a05; color:#f79}
.spots td{padding:5px 14px 5px 0;font-size:13px;vertical-align:top}
.spots td:first-child{color:var(--dim);white-space:nowrap}
.hit{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.hit img{width:48px;height:48px}
button.g.gear{display:none;padding:7px 9px}
button.g.gear svg.i{width:16px;height:16px}
.setup{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:9px 18px;
  border-bottom:1px solid var(--line);background:var(--bg2)}
.fld{display:flex;align-items:center;gap:9px}
.fld .lbl{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim2);font-weight:650}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:3px;max-width:100%}
.seg button.g{background:none;border:1px solid transparent;border-radius:7px;padding:4px 11px;font-size:12.5px}
.seg button.g:hover{background:#222937;color:var(--fg);border-color:transparent}
.seg button.g.on{background:var(--accbg);border-color:#2f4a7a;color:var(--acc2);font-weight:600}
.seg.starters button.g{padding:3px 6px}
.seg.starters button.g.on{background:var(--accbg);box-shadow:inset 0 0 0 1px #2f4a7a}
.setupend{display:flex;gap:8px;align-items:center;margin-left:auto}
#shinybtn.on{border-color:#b08a2e;color:#ffd77a;background:#2a2213}
.tabs{display:none}
.side{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px;
  background:var(--card);border:1px solid var(--line);border-radius:12px;padding:5px}
.side button{background:none;border:1px solid transparent;border-radius:9px;color:var(--dim);
  font:inherit;font-size:11.5px;font-weight:600;padding:9px 4px 8px;cursor:pointer;display:flex;
  flex-direction:column;align-items:center;gap:5px;transition:background .13s,color .13s}
.side button svg.i{width:19px;height:19px;stroke-width:1.6}
.side button:hover{color:var(--fg);background:#212836}
.side button.on{color:var(--acc2);background:var(--accbg);box-shadow:inset 0 0 0 1px #2f4a7a}
@media(max-width:860px){
  .wrap{grid-template-columns:1fr}
  aside{position:static;border-right:0;background:var(--bg);max-height:none;padding:12px 12px 88px}
  .qbox,.side,.kbdhint{display:none}   /* the bottom tab bar is the nav here */
  main{padding:14px 12px 88px;max-width:none}
  header{padding:8px 12px;gap:10px;flex-wrap:wrap;min-height:auto}
  h1{font-size:15px}
  .brand .mark{width:23px;height:23px}
  .hprog{order:3;flex-basis:100%;max-width:none;margin:0 0 2px}
  button.g.gear{display:inline-flex;margin-left:auto}
  .setup{display:none;padding:12px;gap:12px;flex-direction:column;align-items:stretch}
  .fld{justify-content:space-between}
  .setupend{margin:2px 0 0}
  .setupend button.g{flex:1;justify-content:center;min-height:38px}
  body.showsetup .setup{display:flex}
  body:not(.tab-map) aside{display:none}
  body.tab-map main{display:none}
  /* thumbs, not cursors */
  button.g{min-height:34px;padding:6px 12px;font-size:13px}
  .mslots select{min-height:38px;font-size:13px}
  .slot .lv input{width:56px;min-height:30px;font-size:13px}
  .mon{grid-template-columns:56px 48px 1fr;gap:9px}
  .spr{width:48px;height:48px}
  .slots{grid-template-columns:1fr}
  .slot.empty{min-height:34px;padding:4px}
  .pcgrid{grid-template-columns:repeat(5,minmax(0,1fr));max-width:none}
  table.spots{width:100%}
  .spots td:first-child{white-space:normal}
  .spots td{padding-right:8px}
  .ctr div{width:70px}
  .tabs{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;
    background:#161b26f2;backdrop-filter:blur(12px);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -6px 20px -12px #000}
  .tabs button{background:none;border:0;color:var(--dim2);font:inherit;font-size:10.5px;font-weight:600;
    padding:9px 2px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;
    position:relative;transition:color .13s}
  .tabs button svg.i{width:21px;height:21px;stroke-width:1.6}
  .tabs button.on{color:var(--acc)}
  .tabs button.on::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
    width:26px;height:2.5px;border-radius:0 0 3px 3px;background:var(--acc)}
  .tbl{max-height:68vh}
  .colpick{grid-template-columns:repeat(auto-fill,minmax(128px,1fr));padding:10px}
  table.dtbl td.wrap{min-width:170px}
}
/* the reference dexes: one sortable, filterable, column-picked table each */
.dexbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 10px}
.dexbar .count{color:var(--dim);font-size:12px;margin-right:auto;font-variant-numeric:tabular-nums;
  min-width:0;flex:1}
.dexbar .count b{color:var(--fg);font-weight:650}
.colpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:5px 12px;
  padding:11px 13px;margin:0 0 10px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.colpick[hidden]{display:none}         /* a class beats [hidden] in the UA sheet */
.colpick label{display:flex;gap:7px;align-items:center;font-size:13px;color:var(--dim);cursor:pointer}
.colpick label.on{color:var(--fg)}
.colpick input{accent-color:var(--acc);width:15px;height:15px}
.tbl{overflow:auto;max-height:74vh;border:1px solid var(--line);border-radius:10px;background:var(--card);
  -webkit-overflow-scrolling:touch}
table.dtbl{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
table.dtbl th{position:sticky;top:0;z-index:2;height:32px;background:#1d2230;color:var(--dim);
  font-weight:600;text-align:left;white-space:nowrap;padding:6px 10px;border-bottom:1px solid var(--line);
  cursor:pointer;user-select:none}
table.dtbl th:hover{color:var(--fg)}
table.dtbl th .ar{color:var(--acc);line-height:0}
table.dtbl th .ar svg.i{width:11px;height:11px}
table.dtbl th[data-k]:hover .ar{color:var(--acc2)}
table.dtbl tr.frow th{top:32px;z-index:1;height:30px;background:#171b26;padding:3px 5px;cursor:auto}
table.dtbl tr.frow input,table.dtbl tr.frow select{width:100%;min-width:64px;padding:3px 5px;font:inherit;
  font-size:12px;border:1px solid var(--line);border-radius:6px;background:#11151d;color:var(--fg)}
table.dtbl tr.frow input::placeholder{color:#4d5468}
table.dtbl td{padding:5px 10px;border-bottom:1px solid #20242f;vertical-align:middle;white-space:nowrap}
table.dtbl td.num{text-align:right;font-variant-numeric:tabular-nums}
table.dtbl td.wrap{white-space:normal;min-width:210px;color:var(--dim)}
table.dtbl tbody tr:hover{background:#1e2432}
table.dtbl tbody tr.click{cursor:pointer}
table.dtbl img.sp{width:40px;height:40px;display:block}
table.dtbl .nm{color:var(--fg);font-weight:600}
table.dtbl .nm.raw{text-transform:none}
table.dtbl .none{color:#4d5468}
table.dtbl .chip{white-space:nowrap}
.empty{padding:26px 12px;color:var(--dim);font-size:13px;text-align:center}
/* an empty state that says what to do next, not just that there is nothing */
.blank{display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center;
  padding:34px 20px;color:var(--dim)}
.blank svg.i{width:30px;height:30px;color:var(--dim2);stroke-width:1.4}
.blank b{color:var(--fg);font-size:15px;font-weight:600}
.blank span{font-size:13px;max-width:34ch;line-height:1.6}
/* the dex facts on a Pokémon's sheet — reference, so folded away until asked for */
.facts{border-top:1px solid var(--line);padding:10px 0 2px}
.facts summary{cursor:pointer;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);
  display:flex;align-items:center;gap:7px;list-style:none;font-weight:650;padding:2px 0}
.facts summary::-webkit-details-marker{display:none}
.facts summary svg.mk{width:13px;height:13px;transition:transform .15s}
.facts[open] summary svg.mk{transform:rotate(180deg)}
.facts summary:hover{color:var(--fg)}
.facts table{margin-top:8px}
.facts .why{display:block;white-space:normal}
/* art: item icons, type labels, badges. Last, and typed, so the sprite-sizing
   rules above ('.hit img', '.shead img') can't blow these up. */
img.ico{width:26px;height:26px;vertical-align:middle;margin-right:7px;flex:none}
.spots td img.ico{margin-right:4px}
.meta img.ico,.evo small img.ico{width:15px;height:15px;margin:0 3px 0 0}
img.ty{height:12px;width:auto;vertical-align:middle;margin-left:5px}  /* native size — 32x12 */
.shead img.ty{height:24px}
img.badge{width:18px;height:18px;vertical-align:middle;margin-right:5px;object-fit:contain;display:inline}
</style>

<script>/*DATA*/</script>
<script>
const $ = h => { const d = document.createElement('div'); d.innerHTML = h; return d.firstElementChild }
const save = (k, v) => { try { localStorage.setItem('kr:' + k, JSON.stringify(v)) } catch {} }
const load = (k, d) => { try { return JSON.parse(localStorage.getItem('kr:' + k)) ?? d } catch { return d } }
const cap = s => s.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase())
const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]))
// one inline SVG sprite at the top of the page; every icon in the app is a <use> of it,
// sized in em so it tracks whatever text it sits beside and inherits its colour.
const I = (n, cls = '') => `<svg class="i ${cls}" aria-hidden="true"><use href="#i-${n}"></use></svg>`

// The Shiny button in the header swaps every sprite in the app; the dex can show a shiny beside
// the ordinary one whichever way that is set. A species with no shiny draws itself.
let shinyOn = load('shiny', false)
const spr = id => (shinyOn ? SHINY[id] : null) || SPR[id] || ''
const shinySpr = id => SHINY[id] || SPR[id] || ''
// item art. A few catalogue lines name a Pokémon ("Snorlax x2") — those draw the sprite.
const icon = k => !k ? '' : k.startsWith('pkm-') ? spr(k.slice(4)) : (IMG[k] || '')
const ico = (k, cls = 'ico') => icon(k) ? `<img class="${cls}" src="${icon(k)}" alt="" loading="lazy">` : ''
const ty = t => icon(DATA.typeArt[t])
  ? `<img class="ty" src="${icon(DATA.typeArt[t])}" alt="${cap(t)}" title="${cap(t)}" loading="lazy">`
  : `<span class="t">${cap(t)}</span>`
// how you get it, drawn with the item that gets it
const methodIco = m => ico(DATA.methodArt[m])

// How far you've got is mostly inferable: owning something, or knowing a move off a
// machine, proves you reached wherever that comes from. `reached` is the manual floor
// for when you're further along than your catches let on.
let reached = load('reached', (() => { const d = load('done', []); return d.length ? Math.max(...d) + 1 : 0 })())
let progress = 0, evidence = []
const isDone = i => i < progress

function inferProgress() {
  let best = reached, why = []
  const bump = (i, note) => { if (i > best) { best = i; why = [note] } else if (i === best && i > 0) why.push(note) }

  // the earliest stop anything in its family can be got — a safe lower bound
  const familyFloor = id => {
    const fam = (monById[id] || {}).family || (DATA.mon[id] ? [id] : [])
    const ats = [id, ...fam].map(f => monById[f] && monById[f].spots[0].at).filter(a => a != null)
    return ats.length ? Math.min(...ats) : null
  }
  new Set([...party, ...pc, ...seen]).forEach(id => {
    const f = familyFloor(id)
    if (f != null) bump(f, `you have ${cap(M(id).name)}`)
  })
  // a move that only comes off a TM or HM proves you got that machine
  const stopIdx = Object.fromEntries(stops.map((x, i) => [x.id, i]))
  Object.entries(sets).forEach(([pid, list]) => (list || []).forEach(mid => {
    const c = Object.values(DATA.machines).find(x => x.move === mid)
    if (c && c.stop != null && stopIdx[c.stop] != null)
      bump(stopIdx[c.stop], `${cap(M(pid).name)} knows ${cap(DATA.moves[mid].n)} (${c.name})`)
  }))
  progress = Math.min(best, stops.length - 1)
  evidence = [...new Set(why)].slice(0, 4)
}

const setReached = i => { reached = Math.max(0, i); save('reached', reached); render() }
let party = new Set(load('party', load('team', [])).slice(0, 6))
let pc = new Set(load('pc', load('box', [])))
let goal = load('goal', 'story')
let levels = load('levels', {})
let sets = load('sets', {})
// what the dex has registered: you keep the entry after evolving, you don't keep the Pokémon
let seen = new Set(load('seen', [...load('party', []), ...load('pc', [])]))
const M = id => DATA.mon[id] || { name: '#' + id, types: [], bst: 0, growth: 2, baseExp: 60, hms: [], learn: { lv: [], tm: [] } }
const lvOf = id => levels[id] || null
const setLv = (id, n) => {
  n = Math.max(1, Math.min(100, n | 0))
  if (n) levels[id] = n; else delete levels[id]
  save('levels', levels); render()
}

// Gen 3: a battle is worth base_exp x the fainted level / 7. `grind` is what the
// best spot you can reach is worth per battle at each stop.
function battlesTo(id, from, to) {
  const g = DATA.exp[M(id).growth]
  if (!g || to <= from) return 0
  const need = g[Math.min(100, to) - 1] - g[Math.max(1, from) - 1]
  return Math.max(0, Math.round(need / (DATA.games[game].grind[at] * 1.6)))
}
const GOALS = { story: 'beat the game', national: 'National Dex', living: 'Living Dex' }
const PARTY_MAX = 6
const owns = id => party.has(id) || pc.has(id)
function setOwn(id, where) {
  party.delete(id); pc.delete(id)
  if (where === 'party') (party.size < PARTY_MAX ? party : pc).add(id)
  else if (where === 'box') pc.add(id)
  if (where) seen.add(id)
  save('party', [...party]); save('pc', [...pc]); save('seen', [...seen]); render()
}

// Evolving moves the Pokémon and keeps the old dex entry — which is exactly the
// difference between a National Dex (done) and a Living Dex (still needs one).
function evolve(from, to) {
  const where = party.has(from) ? 'party' : 'box'
  party.delete(from); pc.delete(from)
  ;(where === 'party' ? party : pc).add(to)
  if (levels[from]) { levels[to] = levels[from]; delete levels[from] }
  if (sets[from]) { sets[to] = sets[from]; delete sets[from] }   // evolving keeps its moves
  seen.add(from); seen.add(to)
  save('party', [...party]); save('pc', [...pc]); save('levels', levels)
  save('sets', sets); save('seen', [...seen])
  render()
}

// can this evolution be done right now?
function canEvolve(id, o) {
  const lv = lvOf(id)
  if (o.trigger === 'level-up') return o.level ? (lv ? lv >= o.level : false) : !!lv
  if (o.trigger === 'use-item') return at >= DATA.stoneStop || /moon/.test(o.item || '')
  return true                       // trade / friendship: your call, flagged in the UI
}

// National Dex: owning any earlier member of the line registers the rest by evolving.
// Living Dex: you need one of each, simultaneously — nothing covers anything else.
function dexNeed(id, family) {
  if (goal === 'story') return null
  if (goal === 'national' && seen.has(id)) return { s: 'have' }
  if (owns(id)) return { s: 'have' }
  if (goal === 'national') {
    const by = (family || []).find(o => owns(o) && (DATA.evoDown[o] || []).includes(id))
    if (by) return { s: 'covered', by }
  }
  return { s: 'need' }
}
let at = load('at', 0)
let starter = load('starter', 'charmander')
let sortBy = load('sortBy', 'score')
let game = load('game', 'FR')
let query = ''
let notice = ''
let view = 'route'
const mobile = () => matchMedia('(max-width: 860px)').matches
const TABS = [['map', 'map', 'Map'], ['route', 'pin', 'Here'], ['team', 'bag', 'Team'],
              ['find', 'search', 'Find'], ['dex', 'book', 'Dex']]
let showSetup = false
let dexTab = load('dexTab', 'mon'), dexQ = ''
let modalId = null
// Keyboard: 1-5 pick a view, / searches, [ ] walk the route, Esc backs out of whatever
// is open. Typing in a field only ever sees Escape, so filters and level boxes still work.
addEventListener('keydown', e => {
  const el = document.activeElement
  const typing = el && (/^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName) || el.isContentEditable)
  if (e.key === 'Escape') {
    if (modalId) return closeMon()
    if (typing) return el.blur()
    if (showSetup) { showSetup = false; return render() }
    if (query) { query = ''; view = 'route'; return render() }
    return
  }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return
  if (e.key === '/') {
    e.preventDefault()
    if (mobile()) { view = 'find'; render(); const f = document.querySelector('.qm'); if (f) f.focus() }
    else document.getElementById('q').focus()
    return
  }
  if (e.key === '[' || e.key === ']') {
    e.preventDefault()
    return go(Math.min(stops.length - 1, Math.max(0, at + (e.key === ']' ? 1 : -1))))
  }
  const keys = mobile() ? TABS : TABS.filter(([k]) => k !== 'map')
  const n = +e.key
  if (n >= 1 && n <= keys.length) {
    e.preventDefault()
    view = keys[n - 1][0]
    if (view !== 'find') query = ''
    render(); scrollTo(0, 0)
  }
})
matchMedia('(max-width: 860px)').addEventListener('change', () => render())
const SORTS = { score: 'best payoff', effort: 'least effort', value: 'most useful', bst: 'raw power' }

// everything below re-derives when you switch cartridge
let stops, idx, fightById, monById
function useGame() {
  stops = DATA.games[game].stops
  idx = Object.fromEntries(stops.map((s, i) => [s.id, i]))
  fightById = Object.fromEntries(DATA.games[game].fights.map(f => [f.id, f]))
  monById = {}
  stops.forEach((s, i) => s.mons.forEach(m => monById[m.id] = { ...m, stop: i }))
  if (at >= stops.length) at = 0
}
useGame()
const roster = f => f.variants ? f.team.concat(f.variants[DATA.rivalStarter[starter]] || []) : f.team


function drawMap() {
  const M = DATA.map, pos = Object.fromEntries(M.nodes.map(n => [n.id, n]))
  const seaEdge = new Set(M.sea.map(e => e.join('>')))
  const isSea = ([a, b]) => pos[a].kind === 'sea' || pos[b].kind === 'sea'
    || seaEdge.has(a + '>' + b) || seaEdge.has(b + '>' + a)
  const stopsOf = n => pos[n].s.map(x => idx[x])
  const atHere = M.nodes.filter(n => stopsOf(n.id).includes(at))
  const hereNode = (atHere.find(n => n.kind === 'city') || atHere.find(n => n.kind === 'cave')
                    || atHere[0] || {}).id
  const state = n => n === hereNode ? 'here'
    : stopsOf(n).includes(at) || stopsOf(n).every(isDone) ? 'done' : 'future'

  const seg = ([a, b]) => {
    const p = pos[a], q = pos[b]
    return (p.x === q.x || p.y === q.y)
      ? `M${p.x} ${p.y}L${q.x} ${q.y}`
      : `M${p.x} ${p.y}L${q.x} ${p.y}L${q.x} ${q.y}`
  }
  const land = M.edges.filter(e => !isSea(e))
  const spine = land.map(seg).join('') +
    M.nodes.filter(n => n.kind !== 'sea').map(n => `M${n.x} ${n.y}h.01`).join('')
  // a road is "walked" once both ends are behind you — that is the progress read
  const roadClass = ([a, b]) => (state(a) === 'here' || state(b) === 'here') ? 'here'
    : (state(a) !== 'future' && state(b) !== 'future') ? 'done' : 'future'
  const roadsBy = c => land.filter(e => roadClass(e) === c).map(seg).join('')
  const ferries = M.edges.concat(M.sea).filter(isSea).map(seg).join('')
  const tunnels = (M.tunnel || []).map(seg).join('')

  // Only places get a marker. Routes are the roads themselves — drawing a dot on
  // every one was most of the clutter.
  const marker = n => {
    if (n.kind === 'city') return `<circle class="mk" cx="${n.x}" cy="${n.y}" r="2.1"/>` +
      `<circle class="pip" cx="${n.x}" cy="${n.y}" r="0.85"/>`
    if (n.kind === 'cave') return `<rect class="mk" x="${n.x - 1.7}" y="${n.y - 1.4}" width="3.4" height="2.8"/>`
    return ''
  }

  document.getElementById('map').innerHTML = `
    <g class="stripes">${Array.from({ length: 25 }, (_, i) =>
      `<line class="stripe" x1="-2" y1="${8 + i * 4}" x2="102" y2="${8 + i * 4}"/>`).join('')}</g>
    <path class="coast" stroke-width="15" d="${spine}"/>
    <g class="inland">${(M.fill || []).map(f =>
      `<polygon points="${f.map(id => pos[id].x + ',' + pos[id].y).join(' ')}"/>`).join('')}</g>
    <path class="land" stroke-width="12.6" d="${spine}"/>
    <g class="inland2">${(M.fill || []).map(f =>
      `<polygon points="${f.map(id => pos[id].x + ',' + pos[id].y).join(' ')}"/>`).join('')}</g>
    <path class="roadbase" d="${land.map(seg).join('')}"/>
    <path class="road future" d="${roadsBy('future')}"/>
    <path class="road done" d="${roadsBy('done')}"/>
    <path class="road here" d="${roadsBy('here')}"/>
    <path class="tunnel" d="${tunnels}"/>
    <path class="ferry" d="${ferries}"/>
    ${M.nodes.map(n => {
      const st = state(n.id)
      return `<g class="n ${n.kind} ${st}" data-all="${stopsOf(n.id).join(',')}" data-label="${esc(n.label)}">
        <title>${esc(n.label)}</title>
        ${st === 'here' ? `<circle class="halo" cx="${n.x}" cy="${n.y}" r="5.4"/>
                           <circle class="here-dot" cx="${n.x}" cy="${n.y}" r="2.6"/>` : ''}
        ${n.gym && st !== 'here' ? `<circle class="gymring" cx="${n.x}" cy="${n.y}" r="3.3"/>` : ''}
        ${marker(n) || (st === 'here' ? `<circle class="mk" cx="${n.x}" cy="${n.y}" r="1.6"/>` : '')}
        <rect class="hitbox" x="${n.x - 3.4}" y="${n.y - 3.4}" width="6.8" height="6.8"/>
      </g>`
    }).join('')}`

  const head = document.getElementById('maphead')
  const home = (pos[hereNode] || {}).label || stops[at].name
  const show = t => head.textContent = t
  show(home)
  document.querySelectorAll('svg.map g.n').forEach(g => {
    g.onmouseenter = () => show(g.dataset.label)
    g.onmouseleave = () => show(home)
    g.onclick = () => {
      const all = g.dataset.all.split(',').map(Number)
      go(all.find(i => !isDone(i)) ?? all[all.length - 1])
    }
  })
}

const go = i => { at = i; view = 'route'; query = ''; save('at', i); render(); scrollTo(0, 0) }

function chain(m) {
  if (!m.path.length) return ''
  return `<div class="chain"><img src="${spr(m.id)}" alt="${m.name}">` +
    m.path.map(e => `<span>→</span><img src="${spr(e.id)}" alt="${e.name}" title="${cap(e.name)}"><span>${esc(e.how || '')}</span>`).join('') + '</div>'
}

function dexStatusLine(p) {
  const n = dexNeed(p.id, p.family)
  if (!n) return ''
  if (n.s === 'have') return `<div class="dex"><span class="have">${I('check')} you have this one</span></div>`
  if (n.s === 'covered') return `<div class="dex"><span class="covered">${I('diamond')} National Dex: already covered — evolving your ${cap(DATA.names[n.by] || '')} registers it. Only catch it if you want it for a fight.</span></div>`
  if (goal === 'living' && p.family.length > 1)
    return `<div class="dex"><span class="need">${I('diamond')} Living Dex: ${p.family.map(id => cap(DATA.names[id] || '')).join(', ')} all need their own slot — ${p.family.filter(owns).length}/${p.family.length} so far.</span></div>`
  return ''
}

function dexLine(p) {
  const out = []
  if (p.onlyChance)
    out.push(`<span class="only">${I('alert')} only chance in the game — skip it here and it's a trade later</span>`)
  else if (p.also.length)
    out.push(`<span class="later">${I('clock')} also at ${p.also.map(a => esc(a.name.replace(/ —.*/, ''))).join(', ')} — safe to skip if you don't need it now</span>`)
  if (p.wildEvo) {
    const w = p.wildEvo
    const how = w.method === 'walk' ? 'in the grass' : w.method === 'npc-trade' ? 'by trade' : `with the ${cap(w.method)}`
    const where = `${cap(w.where)}, Lv ${w.levels[0]}–${w.levels[1]}` +
      (w.at > p.spots[0].at ? ` (from ${esc(w.stop.replace(/ —.*/, ''))} onward)` : '')
    if (goal === 'national')
      out.push(`<span class="skip">${I('swap')} evolving this one fills all ${p.fills.length} dex entries — no need to catch ${cap(w.name)} separately.</span>`)
    else if (goal === 'living')
      out.push(`<span class="skip">${I('swap')} a Living Dex needs its own ${cap(w.name)} — catch one ${how} at ${where} rather than raising a second ${cap(p.name)}.</span>`)
    else
      out.push(`<span class="skip">${I('swap')} no need to evolve it — ${cap(w.name)} is catchable ${how} at ${where}</span>`)
  }
  return out.length ? `<div class="dex">${out.join('<br>')}</div>` : ''
}

function verTag(p) {
  return p.vers.length === 1
    ? `<span class="ver x">${p.vers[0]} only</span>`
    : ''
}

function findView(m) {
  if (mobile()) {
    const wrap = $(`<div class="qmbox">${I('search')}<input class="qm" placeholder="Pokémon, TM, item, move…" value="${
      esc(query)}" autocomplete="off" aria-label="Search the whole game"></div>`)
    wrap.querySelector('input').oninput = e => {
      query = e.target.value.trim(); render(); document.querySelector('.qm').focus()
    }
    m.append(wrap)
  }
  const q = query.toLowerCase()
  const hits = Object.values(monById).filter(p => p.name.includes(q) || p.final.includes(q)).slice(0, 12)
  const gear = DATA.catalogue.filter(c => c.name.toLowerCase().includes(q) || c.where.toLowerCase().includes(q))
  if (!query) {
    m.append($(`<div class="card"><div class="blank">${I('search')}<b>Search the whole game</b>
      <span>A Pokémon, an item, a TM or a move — you get every place and every level it turns up at,
      on your cartridge.</span></div></div>`))
    return
  }
  m.append($(`<h3>${I('target')}Where to find “${esc(query)}”</h3>`))
  if (gear.length) m.append($(`<div class="card"><table class="spots">${gear.slice(0, 14).map(c =>

      c.stop ? ` <span class="meta">— ${esc((DATA.stopNames[c.stop] || '').replace(/ —.*/, ''))}</span>` : ''}</td></tr>`).join('')}</table></div>`))
  if (!hits.length && !gear.length) {
    m.append($(`<div class="card"><div class="blank">${I('alert')}<b>Nothing in ${
      game === 'FR' ? 'FireRed' : 'LeafGreen'} matches</b>
      <span>It may be a ${game === 'FR' ? 'LeafGreen' : 'FireRed'} exclusive — the Dex tab's
      Blockers panel lists all of them.</span></div></div>`))

  }
  hits.forEach(p => {
    const box = $(`<div class="card">
      <div class="hit"><img src="${spr(p.id)}" alt="${p.name}">
        <div><b style="text-transform:capitalize">${cap(p.name)}</b>${verTag(p)}
        ${p.types.map(ty).join('')}
        <div class="meta">first available: ${esc(p.fromStop)}</div></div></div>
      <table class="spots">${p.spots.map(x => `<tr>
        <td>${esc(x.stop.replace(/ —.*/, ''))}</td>
        <td><b>${cap(x.where)}</b> · ${methodIco(x.method)}${x.method === 'npc-trade' ? 'in-game trade' : cap(x.method)}${x.method === 'walk' ? ` · ${x.rate}%` : ''} · Lv ${x.levels[0]}–${x.levels[1]}</td></tr>`).join('')}</table>
      ${chain(p)}${dexLine(p)}
    </div>`)
    m.append(box)
  })
}

// --- the reference dexes: every species, move and item this game has ---------
const DEXTABS = { mon: 'Pokédex', moves: 'Movedex', items: 'Itemdex', blockers: 'Blockers' }
const STATN = ['HP', 'Atk', 'Def', 'SpA', 'SpD', 'Spe']
// move id -> the machine that teaches it, so the movedex can say "TM26"
const machineOf = Object.fromEntries(Object.values(DATA.machines).map(c => [c.move, c]))
const machineByName = Object.fromEntries(Object.values(DATA.machines).map(c => [c.name, c]))
const TYPES = Object.keys(DATA.eff)                  // this generation's types, in dex order
const dash = '<span class="none">—</span>'

// the defensive half of the chart, which is what a dex page calls "damage taken"
const taken = (types, atk) => types.reduce((x, d) => x * DATA.eff[atk][d] / 100, 1)
const weakTo = types => TYPES.filter(a => taken(types, a) > 1)
const resistsIt = types => TYPES.filter(a => taken(types, a) > 0 && taken(types, a) < 1)
const immuneTo = types => TYPES.filter(a => taken(types, a) === 0)
const DMG = [[4, '×4'], [2, '×2'], [0.5, '×½'], [0.25, '×¼'], [0, '×0']]
const damageTaken = types => DMG.map(([x, label]) => [label, TYPES.filter(a => taken(types, a) === x)])
                                .filter(([, list]) => list.length)

// the games store the split in eighths, and −1 for the ones that have no gender
const genderText = g => g < 0 ? 'genderless' : g === 0 ? '100% male' : g === 8 ? '100% female'
  : `${(100 - g * 12.5).toFixed(g % 2 ? 1 : 0)}% male`
const evText = ev => ev.map((v, i) => v ? `${v} ${STATN[i]}` : '').filter(Boolean).join(', ')
const listOf = a => a && a.length ? esc(a.map(cap).join(', ')) : dash

// how many species in this game can hold each move — a rough "how common is it"
const learntBy = (() => {
  const n = {}
  Object.values(DATA.mon).forEach(sp => {
    new Set([...(sp.learn.lv || []).map(([, i]) => i),
             ...(sp.learn.tm || []).map(t => (DATA.machines[t] || {}).move)])
      .forEach(i => { if (i) n[i] = (n[i] || 0) + 1 })
  })
  return n
})()

// --- one table engine, three dexes ------------------------------------------
// A column says how to read a row, how to draw it and what kind of filter box it
// gets. Everything else — the sort, the per-column filters, which columns are on —
// is generic and remembered per dex, so the table you built is the one you come back to.
let dexSort = load('dexSort', {}), dexCols = load('dexCols', {})
let dexFilt = load('dexFilt', {}), dexPick = load('dexPick', false)

const col = (k, label, get, o = {}) => ({ k, label, get, filter: 'text', ...o })
const flat = v => Array.isArray(v) ? v.join(' ') : v == null ? '' : String(v)

// ">100", "<40", "80-120" or a plain number — what you actually want to ask a stat
function numMatch(v, q) {
  const n = +v, m = q.replace(/\s+/g, '').match(/^(>=|<=|>|<)?(-?[\d.]+)(?:[-–]([\d.]+))?$/)
  if (!isFinite(n) || !m) return false
  const a = +m[2]
  if (m[3] != null) return n >= a && n <= +m[3]
  return m[1] === '>' ? n > a : m[1] === '<' ? n < a
    : m[1] === '>=' ? n >= a : m[1] === '<=' ? n <= a : n === a
}

function passes(c, row, q) {
  if (!q) return true
  const v = c.get(row)
  if (c.filter === 'num') return numMatch(v, q)
  if (c.filter === 'enum')
    return (Array.isArray(v) ? v : [v]).map(x => String(x).toLowerCase()).includes(q.toLowerCase())
  return flat(v).toLowerCase().includes(q.toLowerCase())
}

// Builds the table into `host` and returns its redraw, so the search box above can
// filter without a full re-render — which is what keeps the caret where you left it.
function dexTable(host, key, rows, cols, o) {
  const sort = dexSort[key] || { k: o.sort, dir: 1 }
  const filt = dexFilt[key] || {}
  let on = (dexCols[key] || cols.filter(c => !c.off).map(c => c.k)).filter(k => cols.some(c => c.k === k))
  const shown = () => cols.filter(c => on.includes(c.k))
  const keep = () => {
    dexSort[key] = sort; dexFilt[key] = filt; dexCols[key] = on
    save('dexSort', dexSort); save('dexFilt', dexFilt); save('dexCols', dexCols)
  }

  const bar = $(`<div class="dexbar"><span class="count"></span>
    <button class="g pick" aria-expanded="${!!dexPick}" title="Choose which columns this table shows">${
      I('columns')}Columns</button>
    <button class="g reset" title="Back to the default sort, filters and columns">${
      I('rotate')}Reset</button></div>`)
  const pick = $('<div class="colpick"></div>')
  const wrap = $('<div class="tbl"></div>')
  const table = $('<table class="dtbl"></table>')
  wrap.append(table)
  host.append(bar, pick, wrap)
  pick.hidden = !dexPick
  const pickBtn = bar.querySelector('.pick')
  pickBtn.classList.toggle('on', !!dexPick)
  pickBtn.onclick = () => {
    dexPick = !dexPick; save('dexPick', dexPick); pick.hidden = !dexPick
    pickBtn.setAttribute('aria-expanded', dexPick)
    pickBtn.classList.toggle('on', dexPick)
  }
  bar.querySelector('.reset').onclick = () => {
    on = cols.filter(c => !c.off).map(c => c.k)
    Object.keys(filt).forEach(k => delete filt[k])
    sort.k = o.sort; sort.dir = 1
    keep(); buildPick(); build(); draw()
  }

  function buildPick() {
    pick.innerHTML = ''
    cols.filter(c => c.label).forEach(c => {
      const lab = $(`<label class="${on.includes(c.k) ? 'on' : ''}"><input type="checkbox"${
        on.includes(c.k) ? ' checked' : ''}>${esc(c.label)}</label>`)
      lab.querySelector('input').onchange = e => {
        on = e.target.checked ? cols.filter(x => x.k === c.k || on.includes(x.k)).map(x => x.k)
                              : on.filter(k => k !== c.k)
        if (!e.target.checked) delete filt[c.k]      // an invisible filter is a trap
        lab.className = e.target.checked ? 'on' : ''
        keep(); build(); draw()
      }
      pick.append(lab)
    })
  }

  function build() {
    const cs = shown()
    table.innerHTML = `<thead>
      <tr>${cs.map(c => `<th data-k="${c.k}" title="${esc(c.hint || (c.label ? 'Sort by ' + c.label : ''))}">${
        esc(c.label || '')}${sort.k === c.k
          ? ` <span class="ar">${I(sort.dir > 0 ? 'caret-up' : 'caret-down')}</span>` : ''}</th>`).join('')}</tr>
      <tr class="frow">${cs.map(c => `<th>${
        !c.filter ? '' : c.filter === 'enum'
          ? `<select data-f="${c.k}"><option value="">any</option>${c.opts.map(x =>
              `<option${(filt[c.k] || '') === x ? ' selected' : ''}>${esc(x)}</option>`).join('')}</select>`
          : `<input data-f="${c.k}" value="${esc(filt[c.k] || '')}" placeholder="${
              c.filter === 'num' ? '>50' : '…'}" autocomplete="off">`}</th>`).join('')}</tr>
      </thead><tbody></tbody>`
    table.querySelectorAll('th[data-k]').forEach(th => th.onclick = () => {
      const c = cols.find(x => x.k === th.dataset.k)
      if (c.nosort) return
      if (sort.k === c.k) sort.dir = -sort.dir; else { sort.k = c.k; sort.dir = c.num ? -1 : 1 }
      keep(); build(); draw()
    })
    table.querySelectorAll('[data-f]').forEach(el => {
      const on2 = () => {
        const v = el.value.trim()
        if (v) filt[el.dataset.f] = v; else delete filt[el.dataset.f]
        keep(); draw()
      }
      if (el.tagName === 'SELECT') el.onchange = on2; else el.oninput = on2
    })
  }

  function draw() {
    const cs = shown(), q = dexQ.trim().toLowerCase()
    const c = cols.find(x => x.k === sort.k) || cols[0]
    const val = r => (c.by || c.get)(r)
    const list = rows.filter(r => cs.every(x => passes(x, r, filt[x.k] || ''))
                              && (!q || flat(o.search(r)).toLowerCase().includes(q)))
    list.sort((a, b) => {
      const x = val(a), y = val(b)
      const n = typeof x === 'number' && typeof y === 'number' ? x - y : flat(x).localeCompare(flat(y))
      return n * sort.dir || (a.id > b.id ? 1 : a.id < b.id ? -1 : 0)
    })
    table.querySelector('tbody').innerHTML = list.map((r, i) =>
      `<tr class="${o.click ? 'click' : ''}" data-i="${i}">${cs.map(x =>
        `<td class="${x.num ? 'num' : ''}${x.wrap ? ' wrap' : ''}">${
          x.cell ? x.cell(r) : (flat(x.get(r)) ? esc(flat(x.get(r))) : dash)}</td>`).join('')}</tr>`).join('')
      || `<tr><td colspan="${cs.length}" class="empty">Nothing matches. Clear a filter, or hit reset.</td></tr>`
    if (o.click) table.querySelectorAll('tbody tr[data-i]')
      .forEach(tr => tr.onclick = () => o.click(list[+tr.dataset.i]))
    bar.querySelector('.count').innerHTML = `<b>${list.length}</b> of ${rows.length} ${esc(o.noun)}`
  }

  buildPick(); build(); draw()
  return draw
}

const DEXHINT = { mon: 'search every column — name, type, ability, where…',
                  moves: 'search every column — name, type, machine, effect…',
                  items: 'search every column — item, kind, where, why…' }

const DEXICON = { mon: 'pokeball', moves: 'swords', items: 'disc', blockers: 'lock' }

function dexView(m) {
  const tools = $('<div class="tools"></div>')
  const seg = $('<div class="seg" role="tablist" aria-label="Reference dexes"></div>')
  Object.entries(DEXTABS).forEach(([k, label]) => {
    const b = $(`<button class="g ${dexTab === k ? 'on' : ''}" role="tab" aria-selected="${
      dexTab === k}">${I(DEXICON[k])}${label}</button>`)
    b.onclick = () => { dexTab = k; save('dexTab', k); dexQ = ''; render(); scrollTo(0, 0) }
    seg.append(b)

  m.append(tools)

// what you have done about this species, whatever the goal is
function dexState(id) {
  if (party.has(id)) return 'in party'
  if (pc.has(id)) return 'in the PC'
  if (seen.has(id)) return 'registered'
  const n = dexNeed(id, (monById[id] || {}).family)
  return n && n.s === 'covered' ? 'covered by evolving' : 'not caught'
}
